apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dotnet-api-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mizanussayed/argocd.git
    targetRevision: HEAD
    path: helm/dotnet-api
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: helm-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true