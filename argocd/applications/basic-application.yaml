apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dotnet-api-argo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mizanussayed/argocd.git
    targetRevision: HEAD
    path: basic
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true